[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rarespeech"
version = "0.2.0"
description = "Reproducible evaluation of long-tail lexical fidelity in text-to-speech."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Owen Song"}]
dependencies = []
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Sound/Audio :: Speech"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<1.3", "av>=11,<17"]
rarity = ["wordfreq==3.1.1"]
kokoro-onnx = ["kokoro-onnx==0.6.1"]
plots = ["matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2"]

[project.scripts]
rarespeech = "rarespeech.cli:main"

[project.urls]
Repository = "https://github.com/owenawsong/RareSpeech"
Issues = "https://github.com/owenawsong/RareSpeech/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rarespeech"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
