<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">RareSpeech</title><desc id="desc">Long-tail lexical fidelity for text-to-speech. Core dataset, stress conditions, explicit measurements and inspectable audio.</desc><rect width="1200" height="330" fill="#fafaf8"/><path d="M42 42H1158M42 286H1158M795 68V263" stroke="#bcc2c9"/><text x="46" y="79" font-family="Arial,sans-serif" font-size="12" letter-spacing="2" fill="#526170">ENGLISH · LONG-TAIL TTS EVALUATION</text><text x="42" y="178" font-family="Arial,sans-serif" font-size="83" font-weight="700" letter-spacing="-4" fill="#17191c">RareSpeech</text><text x="47" y="220" font-family="Georgia,serif" font-size="26" fill="#333e4d">The rare word can be the whole point.</text><text x="47" y="255" font-family="Arial,sans-serif" font-size="14" fill="#59606a">128 core cases / 64 term families / 8 specialist domains</text><g font-family="Arial,sans-serif" fill="#243f61"><text x="832" y="96" font-size="12" letter-spacing="1">REPORT THE MEASUREMENTS</text><text x="832" y="140" font-size="20">Lexical retention</text><text x="832" y="177" font-size="20">Word error rate</text><text x="832" y="214" font-size="20">Coverage &amp; uncertainty</text><text x="832" y="251" font-size="20">Audio evidence</text></g></svg>
