name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check src scripts examples tests
      - run: python -m build
      - run: python -m rarespeech validate
      - run: python scripts/check_release.py
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[rarity]"
      - run: python scripts/build_corpus.py
      - run: python scripts/build_site.py
      - run: git diff --exit-code -- data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/rarespeech/web/app.js
